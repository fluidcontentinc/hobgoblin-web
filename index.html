<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Hob Gobbler Hunt</title>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
        margin: 0;
        padding: 0;
        background-color: #000000;
        -webkit-overflow-scrolling: touch;
        touch-action: pan-y;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
        width: 100%;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
        background-color: #000000;
        position: relative;
        -webkit-overflow-scrolling: touch;
      }
      /* Enable touch scrolling for nested divs */
      #root div {
        -webkit-overflow-scrolling: touch;
        touch-action: pan-y;
      }
      /* CRITICAL: ScrollView containers - allow content to expand */
      #root > div > div {
        -webkit-overflow-scrolling: touch !important;
        touch-action: pan-y !important;
        overflow-y: auto !important;
        min-height: 100% !important;
        position: relative !important;
      }
      /* Target React Native Web ScrollView containers */
      div[style*="overflow"],
      div[style*="flex: 1"],
      div[style*="flex:1"],
      div[data-rn-scroll-view],
      div[class*="ScrollView"] {
        -webkit-overflow-scrolling: touch !important;
        touch-action: pan-y !important;
        overflow-y: auto !important;
        overflow-x: hidden !important;
        min-height: 100% !important;
        position: relative !important;
      }
      /* Ensure ScrollView content containers can expand */
      div[style*="flexGrow"],
      div[style*="flex-grow"],
      div[style*="paddingBottom"] {
        min-height: 100%;
      }
      /* Force enable touch scrolling on mobile */
      @media (hover: none) and (pointer: coarse) {
        #root > div > div {
          overflow-y: scroll !important;
          -webkit-overflow-scrolling: touch !important;
          touch-action: pan-y !important;
          min-height: 100% !important;
        }
        /* Ensure ScrollView content is visible and scrollable */
        div[style*="paddingBottom"],
        div[style*="flexGrow"] {
          overflow-y: visible !important;
          -webkit-overflow-scrolling: touch !important;
        }
      }
      /* Custom thin dark-theme scrollbar (Spec #5a) */
      ::-webkit-scrollbar { width: 8px; height: 8px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.16);
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.28); }
      ::-webkit-scrollbar-corner { background: transparent; }
      * {
        scrollbar-width: thin;
        scrollbar-color: rgba(255, 255, 255, 0.16) transparent;
      }
    </style>
  <link rel="icon" href="/favicon.ico" /></head>
